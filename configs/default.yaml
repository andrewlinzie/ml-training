task:
  name: transaction_fraud
  target: is_fraud
  problem_type: binary_classification

data:
  raw_path: data/raw/transactions.csv
  processed_dir: data/processed

features:
  - amount
  - hour_of_day
  - day_of_week
  - merchant_risk
  - device_trust
  - is_international

split:
  test_size: 0.2
  random_state: 42
  stratify: true

seed: 42

model:
  type: logistic_regression
  params:
    max_iter: 1000
    C: 1.0

paths:
  model_path: models/model.joblib