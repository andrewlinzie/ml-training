task:
  name: transaction_fraud
  target: is_fraud
  problem_type: binary_classification

data:
  raw_path: data/raw/transactions.csv
  processed_dir: data/processed
  train_path: data/processed/train.csv
  val_path: data/processed/val.csv

features:
  - amount
  - hour_of_day
  - day_of_week
  - merchant_risk
  - device_trust
  - is_international

metrics:
  report_path: metrics/train_metrics.json

paths:
  model_path: models/model.joblib
  package_dir: models/packaged/fraud_classifier