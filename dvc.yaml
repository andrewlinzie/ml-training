stages:
  prepare:
    cmd: python -m ml_training.prepare --config configs/default.yaml
    deps:
      - src/ml_training/prepare.py
      - src/ml_training/config.py
      - configs/default.yaml
      - data/raw/transactions.csv
    params:
      - prepare
    outs:
      - data/processed/train.csv
      - data/processed/val.csv

  train:
    cmd: python -m ml_training.train --config configs/default.yaml
    deps:
      - src/ml_training/train.py
      - src/ml_training/config.py
      - configs/default.yaml
      - data/processed/train.csv
    params:
      - train
    outs:
      - models/model.joblib

  evaluate:
    cmd: python -m ml_training.evaluate --config configs/default.yaml
    deps:
      - src/ml_training/evaluate.py
      - src/ml_training/config.py
      - configs/default.yaml
      - models/model.joblib
      - data/processed/val.csv
    params:
      - evaluate
      - train.seed
    metrics:
      - metrics/train_metrics.json:
          cache: false

  log:
    cmd: python -m ml_training.log_run --config configs/default.yaml
    deps:
      - src/ml_training/log_run.py
      - src/ml_training/config.py
      - src/ml_training/package_model.py
      - configs/default.yaml
      - metrics/train_metrics.json
      - models/packaged/fraud_classifier
    params:
      - prepare
      - train
      - evaluate
    outs:
      - metrics/mlflow_run.json:
          cache: false
